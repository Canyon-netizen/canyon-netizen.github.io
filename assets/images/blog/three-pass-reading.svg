<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-label="三遍阅读法：先鸟瞰、再理解、最后复现">
<defs>
  <linearGradient id="fig-bg" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#f6f8fc"/><stop offset="100%" stop-color="#eef2f8"/>
  </linearGradient>
  <marker id="fig-arrow" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
    <path d="M0,0 L7,3.2 L0,6.4 z" fill="#8aa0b8"/>
  </marker>
</defs>
<rect width="960" height="420" rx="18" fill="url(#fig-bg)"/>
<text x="480.0" y="66" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="30" font-weight="700" fill="#16202e">论文三遍阅读法</text>
<text x="480.0" y="100" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="16" fill="#718096">第一遍判断值不值得读 · 第二遍弄清方法 · 第三遍内化取舍</text>
<g transform="translate(36.0,150)">
  <rect width="268" height="168" rx="14" fill="#ffffff" stroke="#dbe3ee"/>
  <rect width="268" height="6" rx="3" fill="#2b6cb0" opacity="0.9"/>
  <text x="24" y="52" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="17" font-weight="700" fill="#2b6cb0">第一遍</text>
  <text x="24" y="90" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="27" font-weight="700" fill="#16202e">鸟瞰</text>
  <text x="24" y="120" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="15" fill="#4a5568">15–20 分钟</text>
  <text x="24" y="146" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="14" fill="#718096">判断值不值得细读</text>
</g>
<line x1="310.0" y1="234.0" x2="336.0" y2="234.0" stroke="#8aa0b8" stroke-width="2" marker-end="url(#fig-arrow)"/>
<g transform="translate(346.0,150)">
  <rect width="268" height="168" rx="14" fill="#ffffff" stroke="#dbe3ee"/>
  <rect width="268" height="6" rx="3" fill="#1e3a5f" opacity="0.9"/>
  <text x="24" y="52" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="17" font-weight="700" fill="#1e3a5f">第二遍</text>
  <text x="24" y="90" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="27" font-weight="700" fill="#16202e">理解</text>
  <text x="24" y="120" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="15" fill="#4a5568">1–2 小时</text>
  <text x="24" y="146" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="14" fill="#718096">搞清方法核心思想</text>
</g>
<line x1="620.0" y1="234.0" x2="646.0" y2="234.0" stroke="#8aa0b8" stroke-width="2" marker-end="url(#fig-arrow)"/>
<g transform="translate(656.0,150)">
  <rect width="268" height="168" rx="14" fill="#ffffff" stroke="#dbe3ee"/>
  <rect width="268" height="6" rx="3" fill="#4299e1" opacity="0.9"/>
  <text x="24" y="52" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="17" font-weight="700" fill="#4299e1">第三遍</text>
  <text x="24" y="90" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="27" font-weight="700" fill="#16202e">复现</text>
  <text x="24" y="120" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="15" fill="#4a5568">半天–1 天</text>
  <text x="24" y="146" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="14" fill="#718096">提出 5–10 个可追问的问题</text>
</g>
<text x="480.0" y="364" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="14" fill="#718096">一周一篇精读 + 三五篇泛读，是比较舒服的节奏</text>
</svg>