<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" width="480" height="480" role="img" aria-label="周睿头像占位">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="55%" stop-color="#2b6cb0"/>
      <stop offset="100%" stop-color="#4299e1"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.25"/>
    </linearGradient>
    <radialGradient id="glow" cx="30%" cy="24%" r="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="mesh" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="480" height="480" fill="url(#bgGrad)"/>
  <rect width="480" height="480" fill="url(#mesh)"/>
  <rect width="480" height="480" fill="url(#glow)"/>

  <circle cx="240" cy="240" r="168" fill="none" stroke="url(#ringGrad)" stroke-width="2" stroke-dasharray="10 12" opacity="0.7"/>
  <circle cx="240" cy="240" r="140" fill="#ffffff" fill-opacity="0.08"/>

  <text x="240" y="240" text-anchor="middle" dominant-baseline="central"
        font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,'Segoe UI',sans-serif"
        font-size="150" font-weight="700" fill="#ffffff" fill-opacity="0.95">周</text>

  <text x="240" y="404" text-anchor="middle"
        font-family="-apple-system,'Segoe UI',sans-serif"
        font-size="22" font-weight="500" fill="#ffffff" fill-opacity="0.62" letter-spacing="3">ZHOU RUI</text>
</svg>
