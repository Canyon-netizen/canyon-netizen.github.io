<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1e3a5f">
<link rel="preload" as="style" href="__BASE__assets/css/style.css">
<link rel="manifest" href="__BASE__manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="{{brandText}}">
<link rel="icon" type="image/svg+xml" href="__BASE__assets/images/favicon.svg">
<link rel="apple-touch-icon" href="__BASE__assets/images/favicon.svg">
<link rel="alternate" type="application/rss+xml" title="{{rssTitle}}" href="__BASE__rss.xml">
<meta name="author" content="{{brandText}}">
<meta name="robots" content="index, follow">
<meta property="og:site_name" content="{{brandText}}">
<meta property="og:image" content="https://canyon-netizen.github.io/assets/images/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:locale" content="{{htmlLang}}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://canyon-netizen.github.io/assets/images/og-image.png">
<link rel="alternate" hreflang="zh-CN" href="{{langZhPath}}">
<link rel="alternate" hreflang="en" href="{{langEnPath}}">
<link rel="alternate" hreflang="x-default" href="{{langZhPath}}">
<!-- 结构化数据占位：由 partial-loader.js 按页面类型填入 JSON-LD -->
<script type="application/ld+json" data-ldjson="site"></script>
<script type="application/ld+json" data-ldjson="page"></script>
