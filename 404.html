","topics":[],"homepage":"","archived":false}},{"title":"一页 — 智能小说创作平台","titleEn":"Yiye — AI-assisted novel writing platform","status":"active","statusLabel":"开发中","statusLabelEn":"In development","description":"面向长篇创作的写作平台：11 种小说类型各有专属提示词，含预设模板市场、续写 / 润色 / 建议 / 命名等写作助手，并支持多家模型 API 与本地模拟。","descriptionEn":"A long-form writing platform: eleven genres each with their own prompt system, a preset template marketplace, assistants for continuation, polishing, suggestions and naming, and support for several model APIs plus a local mock mode.","tech":["JavaScript","HTML","CSS","LLM API"],"links":[{"label":"GitHub","href":"https://github.com/Canyon-netizen/novel"}],"stats":{"repo":"novel","stars":0,"forks":0,"language":"JavaScript","languageAuto":"JavaScript","license":"","createdAt":"2025-09-14","pushedAt":"2026-07-02","topics":[],"homepage":"","archived":false},"cvFeatured":false}],"awards":[],"skills":{"languages":[{"name":"Python","level":"熟练","levelEn":"Proficient"},{"name":"C/C++","level":"熟练","levelEn":"Proficient"},{"name":"Java","level":"了解","levelEn":"Basic"}],"tools":[{"name":"PyTorch"},{"name":"TensorFlow"},{"name":"Hugging Face"},{"name":"LaTeX"}],"spoken":[{"name":"中文","nameEn":"Chinese","level":"母语","levelEn":"Native"},{"name":"英语","nameEn":"English","level":"流利","levelEn":"Fluent"}]},"posts":[{"slug":"2026-06-20-research-notes","date":"2026-06-20","category":"research","categoryLabel":"研究","categoryLabelEn":"Research","readTime":"约 5 分钟","readTimeEn":"5 min read","title":"研究笔记：从零开始读一篇论文","titleEn":"Research notes: reading a paper from scratch","href":"blog/2026-06-20-research-notes.html","hrefEn":"blog/2026-06-20-research-notes.html","excerpt":"分享一下我读论文的\"三遍阅读法\"，以及如何用一周时间吃透一篇顶会论文。从标题、摘要到实验设计，每一步的侧重点和常见误区都讲清楚。","excerptEn":"My \"three-pass\" approach to reading papers, and how I work through a top-conference paper in a week — what to focus on at each step, from title and abstract to experimental design, plus the pitfalls to avoid.","published":true,"content":"<p>\n读论文是研究生的日常。一篇顶会论文动辄 8-15 页，方法 + 实验 + 附录，可能还有补充材料。\n很多同学（包括曾经的我）会一头扎进细节，结果读了一周还是云里雾里。\n这里分享一下我的\"三遍阅读法\"。\n<\/p>\n\n<figure class=\"post-figure\">\n    <img src=\"../assets/images/blog/three-pass-reading.svg\"\n         width=\"960\" height=\"420\"\n         alt=\"三遍阅读法示意：第一遍鸟瞰 15–20 分钟判断值不值得细读；第二遍理解 1–2 小时搞清方法核心思想；第三遍复现半天到一天，提出 5–10 个可追问的问题\">\n    <figcaption>三遍阅读法：每一遍的目标不同，读到的深度也不同（点击可放大）。<\/figcaption>\n<\/figure>\n\n<h2>第一遍：鸟瞰（15-20 分钟）<\/h2>\n<p>\n目标：判断这篇论文值不值得细读、属于哪个子方向。\n<\/p>\n<ul>\n<li><strong>标题 + 摘要<\/strong>：解决什么问题？用什么方法？有什么结果？<\/li>\n<li><strong>Introduction 末尾<\/strong>：通常会列出 3-5 个具体贡献，这部分是最有信息密度的。<\/li>\n<li><strong>章节标题 + 图表标题<\/strong>：快速浏览，了解文章整体结构。<\/li>\n<li><strong>结论<\/strong>：看作者认为自己的工作有什么意义。<\/li>\n<\/ul>\n<p>\n读完之后，你应该能用自己的话概括出：\"本文针对 XXX 问题，提出了 XXX 方法，\n在 XXX 数据集上比 SOTA 提升了 X%。\"\n<\/p>\n\n<h2>第二遍：理解（1-2 小时）<\/h2>\n<p>\n目标：理解方法的核心思想，能复述、能向他人解释。\n<\/p>\n<ul>\n<li>仔细读 <strong>方法章节<\/strong>，对每个公式问\"它在算什么\"。<\/li>\n<li>画一张 <strong>系统框架图<\/strong>，用纸笔画出来。<\/li>\n<li>跳过复杂的数学推导，<strong>重点是直觉<\/strong>。<\/li>\n<li>遇到不熟悉的概念，标记下来后查资料，不要中断阅读节奏。<\/li>\n<\/ul>\n\n<blockquote>\n<p>好的论文读完后，你能在脑海中\"播放\"它的方法流程图；差的论文读完后，你只记得一堆符号。<\/p>\n<\/blockquote>\n\n<h2>第三遍：复现（半天-1 天）<\/h2>\n<p>\n目标：发现论文的隐藏细节、实验设置的合理性、未明确说明的取舍。\n<\/p>\n<ul>\n<li>假设你要复现这篇论文，你会遇到什么问题？<\/li>\n<li>作者没说清的：超参数怎么选？数据怎么切分？失败案例是什么？<\/li>\n<li>实验设计是否公平？<strong>baseline 是不是选得最有利<\/strong>？<\/li>\n<li>把上面的疑问整理成 5-10 个问题，去找作者发的代码或者去读作者的博士论文。<\/li>\n<\/ul>\n\n<h2>一些个人习惯<\/h2>\n<ol>\n<li><strong>不动笔墨不读书<\/strong>：每篇精读论文都有 1-2 页的笔记，半年后翻出来仍然能复述。<\/li>\n<li><strong>先跑代码再读<\/strong>：能跑通的代码能让方法变得具体。<\/li>\n<li><strong>和同学讲一遍<\/strong>：讲不清楚就说明没真懂。<\/li>\n<li><strong>组会上分享<\/strong>：逼自己用 20 分钟讲清楚，是最好的输出练习。<\/li>\n<\/ol>\n\n<h2>小结<\/h2>\n<p>\n读论文不是看小说，而是一次\"逆向工程\"。\n第一遍判断值不值得读，第二遍搞清楚方法是什么，第三遍才真正内化作者的取舍。\n一周一篇精读 + 三五篇泛读，是比较舒服的节奏。\n<\/p>","contentEn":"<p>\nReading papers is a daily routine in research. A top-conference paper runs 8-15 pages:\nmethod, experiments, appendix, and possibly supplementary material. Many students\n(including me, once) dive straight into the details and come out a week later still\nconfused. Here is the \"three-pass\" approach I use.\n<\/p>\n\n<figure class=\"post-figure\">\n    <img src=\"../../assets/images/blog/three-pass-reading.svg\"\n         width=\"960\" height=\"420\"\n         alt=\"The three-pass reading method: pass one, skim for 15-20 minutes to decide whether the paper is worth a close read; pass two, understand the method in 1-2 hours; pass three, reproduce it over half a day to a day and list 5-10 questions worth pursuing.\">\n    <figcaption>The three-pass method: each pass has a different goal, and each gets you deeper (click to enlarge).<\/figcaption>\n<\/figure>\n\n<h2>Pass 1: Skim (15-20 minutes)<\/h2>\n<p>\nGoal: decide whether the paper deserves a close read, and which subfield it belongs to.\n<\/p>\n<ul>\n<li><strong>Title and abstract<\/strong>: what problem, what method, what result?<\/li>\n<li><strong>The end of the Introduction<\/strong>: usually 3-5 concrete contributions; this is the densest part of the paper.<\/li>\n<li><strong>Section and figure captions<\/strong>: skim them to understand the overall structure.<\/li>\n<li><strong>Conclusion<\/strong>: see what the authors believe their work means.<\/li>\n<\/ul>\n<p>\nAfter this pass you should be able to summarise it in your own words: \"This paper\ntargets problem X, proposes method Y, and improves on the state of the art by Z% on\ndataset W.\"\n<\/p>\n\n<h2>Pass 2: Understand (1-2 hours)<\/h2>\n<p>\nGoal: understand the core idea of the method well enough to restate it and explain it to someone else.\n<\/p>\n<ul>\n<li>Read the <strong>method section<\/strong> carefully, and for every equation ask \"what is this computing?\"<\/li>\n<li>Draw a <strong>system diagram<\/strong> by hand.<\/li>\n<li>Skip the heavy derivations; <strong>the intuition is the point<\/strong>.<\/li>\n<li>Mark unfamiliar concepts to look up later instead of breaking your reading rhythm.<\/li>\n<\/ul>\n<blockquote>\n    <p>After a good paper you can \"play back\" its method diagram in your head. After a bad one you only remember a pile of symbols.<\/p>\n<\/blockquote>\n\n<h2>Pass 3: Reproduce (half a day to a day)<\/h2>\n<p>\nGoal: find the hidden details, whether the experimental setup is sound, and what the authors did not say.\n<\/p>\n<ul>\n<li>If you had to reproduce it, what would you run into?<\/li>\n<li>What the authors left out: how were hyperparameters chosen? How was the data split? What are the failure cases?<\/li>\n<li>Is the experimental design fair? Is <code>baseline<\/code> the strongest available choice?<\/li>\n<li>Turn the above into 5-10 questions, then look for the authors' code or their students' follow-up papers.<\/li>\n<\/ul>\n\n<h2>A few habits<\/h2>\n<ol>\n    <li>Never read without a pen: every close read gets 1-2 pages of notes, so that six months later you can still reconstruct it.<\/li>\n    <li>Code first, theory second: code that runs makes the method concrete.<\/li>\n    <li>Explain it to a classmate: if you cannot make it clear, you have not understood it.<\/li>\n    <li>Share in a group meeting: forcing yourself to explain it in 20 minutes is the best practice there is.<\/li>\n<\/ol>\n\n<h2>Summary<\/h2>\n<p>\nReading a paper is not reading a novel; it is reverse engineering. The first pass tells\nyou whether it is worth reading, the second tells you what the method actually is, and\nthe third is where you internalise the authors' trade-offs. One close read plus three to\nfive skims a week is a comfortable pace.\n<\/p>","relatedPages":["research","publications","talks"],"relatedPagesEn":["research","publications","talks"]},{"slug":"2026-05-08-python-config","date":"2026-05-08","category":"tech","categoryLabel":"技术","categoryLabelEn":"Tech","readTime":"约 8 分钟","readTimeEn":"8 min read","title":"Python 项目配置管理：环境变量、配置文件、密钥","titleEn":"Managing Python project configuration: environment variables, config files and secrets","href":"blog/2026-05-08-python-config.html","hrefEn":"blog/2026-05-08-python-config.html","excerpt":"一个 Python 项目往往需要在不同环境（开发/测试/生产）下切换配置。本文整理了我常用的几种配置管理方式，以及它们各自的适用场景。","excerptEn":"A Python project usually needs different configuration across environments (development, testing, production). This article collects the configuration approaches I use most, and when each of them fits.","published":true,"content":"<p>\n    一个工程化的 Python 项目往往要处理多种配置：数据库连接、API 密钥、模型超参、\n    不同的运行环境（开发/测试/生产）。本文整理几种常见方案的取舍。\n<\/p>\n\n<h2>1. 环境变量（最基础）<\/h2>\n<p>用 <code>os.environ<\/code> 读取，简单但弱类型、不便管理。<\/p>\n<pre><code class=\"language-python\">import os\nDB_URL = os.environ.get(\"DATABASE_URL\", \"sqlite:///dev.db\")\n<\/code><\/pre>\n\n<h2>2. .env 文件 + python-dotenv<\/h2>\n<p>\n    把环境变量写进 <code>.env<\/code>，开发时方便切换。\n    一定要把 <code>.env<\/code> 加进 <code>.gitignore<\/code>。\n<\/p>\n<pre><code class=\"language-bash\"># .env\nDATABASE_URL=postgres://...\nSECRET_KEY=xxx\n<\/code><\/pre>\n\n<h2>3. YAML/JSON/TOML 配置文件<\/h2>\n<p>适合结构化配置，比如 ML 训练的超参。<\/p>\n<pre><code class=\"language-yaml\"># config.yaml\nmodel:\n  name: resnet50\n  lr: 0.001\n  batch_size: 64\ndata:\n  train: data/train\n  val: data/val\n<\/code><\/pre>\n\n<h2>4. Pydantic Settings（推荐）<\/h2>\n<p>\n    类型安全 + 自动校验 + 多来源合并（env > file > default）。\n    新项目强烈推荐。\n<\/p>\n<pre><code class=\"language-python\">from pydantic_settings import BaseSettings\n\nclass Settings(BaseSettings):\n    db_url: str\n    secret_key: str\n    debug: bool = False\n\n    class Config:\n        env_file = \".env\"\n\nsettings = Settings()\n<\/code><\/pre>\n\n<h2>5. 密钥管理<\/h2>\n<p>\n    永远不要把密钥写进代码、配置文件、git。\n    团队项目用 <strong>Vault / AWS Secrets Manager / GCP Secret Manager<\/strong>；\n    个人项目至少用 <code>.env<\/code> 并加 <code>.gitignore<\/code>。\n<\/p>\n\n<blockquote>\n    <p>如果密钥曾经提交到 git，立刻 rotate（重新生成）并清理 git history。<\/p>\n<\/blockquote>\n\n<h2>我的实践<\/h2>\n<ol>\n    <li>小脚本：直接 <code>os.environ<\/code> + <code>.env<\/code>。<\/li>\n    <li>中等项目：<strong>Pydantic Settings<\/strong> + <code>.env<\/code>。<\/li>\n    <li>训练实验：<code>Hydra<\/code> 或 <code>OmegaConf<\/code> 做配置组合。<\/li>\n    <li>生产部署：<strong>12-factor<\/strong>，配置全部走环境变量，密钥交给云服务。<\/li>\n<\/ol>","contentEn":"<p>\nA production Python project juggles several kinds of configuration: database\nconnections, API keys, model hyperparameters, and different environments\n(development, testing, production). This is how I think about the trade-offs.\n<\/p>\n\n<h2>1. Environment variables (the baseline)<\/h2>\n<p>Read with <code>os.environ<\/code>. Simple, but weakly typed and awkward to manage.<\/p>\n<pre><code class=\"language-python\">import os\nDB_URL = os.environ.get(\"DATABASE_URL\", \"sqlite:///dev.db\")\n<\/code><\/pre>\n\n<h2>2. .env files + python-dotenv<\/h2>\n<p>\nPut environment variables in <code>.env<\/code> so switching is easy during development.\nAlways add <code>.env<\/code> to <code>.gitignore<\/code>.\n<\/p>\n<pre><code class=\"language-bash\"># .env\nDATABASE_URL=postgres://...\nSECRET_KEY=xxx\n<\/code><\/pre>\n\n<h2>3. YAML / JSON / TOML config files<\/h2>\n<p>Good for structured configuration, such as machine-learning hyperparameters.<\/p>\n<pre><code class=\"language-yaml\"># config.yaml\nmodel:\n  name: resnet50\n  lr: 0.001\n  batch_size: 64\ndata:\n  train: data/train\n  val: data/val\n<\/code><\/pre>\n\n<h2>4. Pydantic Settings (recommended)<\/h2>\n<p>\nType safety, automatic validation, and merging across sources\n(env &gt; file &gt; default). My default choice for new projects.\n<\/p>\n<pre><code class=\"language-python\">from pydantic_settings import BaseSettings\n\nclass Settings(BaseSettings):\n    db_url: str\n    secret_key: str\n    debug: bool = False\n\n    class Config:\n        env_file = \".env\"\n\nsettings = Settings()\n<\/code><\/pre>\n\n<h2>5. Secrets<\/h2>\n<p>\nNever put secrets in code, config files, or git. Team projects should use\n<strong>Vault / AWS Secrets Manager / GCP Secret Manager<\/strong>; personal projects\nshould at least use <code>.env<\/code> plus <code>.gitignore<\/code>.\n<\/p>\n\n<blockquote>\n    <p>If a secret was ever committed, rotate it immediately and clean up the git history.<\/p>\n<\/blockquote>\n\n<h2>What I do in practice<\/h2>\n<ol>\n    <li>Small scripts: <code>os.environ<\/code> plus <code>.env<\/code>.<\/li>\n    <li>Medium projects: <strong>Pydantic Settings<\/strong> plus <code>.env<\/code>.<\/li>\n    <li>Training runs: <code>Hydra<\/code> or <code>OmegaConf<\/code> for composing configs.<\/li>\n    <li>Deployment: <strong>12-factor<\/strong>, all configuration via environment variables, secrets handled by the cloud provider.<\/li>\n<\/ol>","relatedPages":["projects","cv","research"],"relatedPagesEn":["projects","cv","research"]}],"books":[{"category":"技术与工程","categoryEn":"Technology & Engineering","icon":"📚","items":[{"title":"深入理解计算机系统 (CSAPP)","titleEn":"Computer Systems: A Programmer's Perspective (CSAPP)","author":"Randal E. Bryant","rating":{"stars":5},"comment":"计算机基础\"圣经\"，从硬件到应用层打通，强烈推荐。","commentEn":"A classic of computer-systems fundamentals: it connects the hardware layer all the way up to applications. Highly recommended."},{"title":"设计模式","titleEn":"Design Patterns: Elements of Reusable Object-Oriented Software","author":"Gang of Four","rating":{"stars":4},"comment":"面向对象设计的经典，但部分模式已过时，需结合现代语言特性理解。","commentEn":"The classic of object-oriented design. Some patterns are dated, so read them alongside the features of modern languages."},{"title":"深度学习 (花书)","titleEn":"Deep Learning (the \"flower book\")","author":"Ian Goodfellow","rating":{"stars":4},"comment":"深度学习领域的\"圣经\"，理论扎实，但代码示例已过时。","commentEn":"The reference text for deep learning: solid theory, though the code examples are outdated."}]},{"category":"文学","categoryEn":"Literature","icon":"📖","items":[{"title":"百年孤独","titleEn":"One Hundred Years of Solitude","author":"加西亚·马尔克斯","authorEn":"Gabriel García Márquez","rating":{"stars":5},"comment":"魔幻现实主义代表作，每读一遍都有新发现。","commentEn":"The landmark of magical realism; every rereading reveals something new."},{"title":"三体","titleEn":"The Three-Body Problem","author":"刘慈欣","authorEn":"Liu Cixin","rating":{"stars":5},"comment":"中国科幻的巅峰之作，宏大的宇宙观和深刻的人性思考。","commentEn":"A high point of Chinese science fiction, with a vast cosmic vision and sharp reflection on human nature."}]},{"category":"传记与人物","categoryEn":"Biography & People","icon":"🌟","items":[{"title":"活出生命的意义","titleEn":"Man's Search for Meaning","author":"维克多·弗兰克尔","authorEn":"Viktor E. Frankl","rating":{"stars":5},"comment":"从集中营经历中提炼的意义疗法，震撼人心。","commentEn":"Logotherapy distilled from the author's concentration-camp experience; a deeply affecting book."}]},{"category":"正在读","categoryEn":"Currently Reading","icon":"🎯","items":[{"title":"思考，快与慢","titleEn":"Thinking, Fast and Slow","author":"Daniel Kahneman","rating":{"status":"reading","label":"⏳ 在读","labelEn":"⏳ Reading"},"comment":"卡尼曼的认知心理学经典，系统 1 与系统 2 的思考框架很有启发。","commentEn":"Kahneman's classic of cognitive psychology; the System 1 / System 2 framework is a useful way to think about judgement."}]}],"hobbies":[{"icon":"🏃","name":"跑步","nameEn":"Running","desc":"每周 3-5 次，配速 5'30\"。跑步是给大脑放空的时间。","descEn":"Three to five runs a week at around 5'30\" per kilometre. Running is when my mind gets to wander."},{"icon":"📷","name":"摄影","nameEn":"Photography","desc":"街头与旅行摄影，主要用手机拍摄。喜欢捕捉光影瞬间。","descEn":"Street and travel photography, mostly shot on a phone. I like catching the moment when light and shadow meet."},{"icon":"🎸","name":"吉他","nameEn":"Guitar","desc":"练习指弹，目前在啃《River Flows in You》。","descEn":"Practising fingerstyle guitar; currently working through \"River Flows in You\"."},{"icon":"✍️","name":"写作","nameEn":"Writing","desc":"偶尔写博客和短文，整理思路的方式。","descEn":"Occasional blog posts and short essays — a way of organising my thoughts."},{"icon":"☕","name":"手冲咖啡","nameEn":"Pour-over Coffee","desc":"每天一杯埃塞俄比亚耶加雪菲，浅烘，花香突出。","descEn":"One cup a day: Ethiopian Yirgacheffe, light roast, with a pronounced
